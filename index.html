<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reel List — Movie Watchlist Manager</title>
<meta name="description" content="A dark, ticket-inspired movie watchlist manager built with vanilla HTML, CSS and JavaScript.">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ============ HEADER ============ -->
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="24" cy="24" r="20" stroke="currentColor" stroke-width="2.5"/>
          <circle cx="24" cy="24" r="6.5" stroke="currentColor" stroke-width="2.5"/>
          <circle cx="24" cy="9" r="2.4" fill="currentColor"/>
          <circle cx="37" cy="17" r="2.4" fill="currentColor"/>
          <circle cx="37" cy="31" r="2.4" fill="currentColor"/>
          <circle cx="24" cy="39" r="2.4" fill="currentColor"/>
          <circle cx="11" cy="31" r="2.4" fill="currentColor"/>
          <circle cx="11" cy="17" r="2.4" fill="currentColor"/>
        </svg>
        <div class="brand-text">
          <span class="brand-title">Reel List</span>
          <span class="brand-tagline">your watchlist, curated</span>
        </div>
      </div>

      <div class="header-controls">
        <div class="search-field">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input type="text" id="searchInput" placeholder="Search your watchlist…" aria-label="Search movies">
        </div>

        <button id="addMovieBtn" class="btn btn-primary">
          <span class="btn-plus">＋</span> Add Movie
        </button>
      </div>
    </div>
  </header>

  <!-- ============ STATS STRIP ============ -->
  <section class="stats-strip" aria-label="Watchlist summary">
    <div class="stats-inner">
      <div class="stat">
        <span class="stat-value" id="statTotal">0</span>
        <span class="stat-label">Total Titles</span>
      </div>
      <div class="stat-divider" aria-hidden="true"></div>
      <div class="stat">
        <span class="stat-value" id="statWatched">0</span>
        <span class="stat-label">Watched</span>
      </div>
      <div class="stat-divider" aria-hidden="true"></div>
      <div class="stat">
        <span class="stat-value" id="statUnwatched">0</span>
        <span class="stat-label">To Watch</span>
      </div>
      <div class="stat-divider" aria-hidden="true"></div>
      <div class="stat">
        <span class="stat-value" id="statAvgRating">0.0</span>
        <span class="stat-label">Avg Rating</span>
      </div>
    </div>
  </section>

  <!-- ============ TOOLBAR: FILTERS + SORT ============ -->
  <section class="toolbar">
    <div class="toolbar-inner">
      <div class="filter-group" role="group" aria-label="Filter by genre">
        <button class="chip active" data-genre="All">All Genres</button>
        <button class="chip" data-genre="Action">Action</button>
        <button class="chip" data-genre="Drama">Drama</button>
        <button class="chip" data-genre="Comedy">Comedy</button>
        <button class="chip" data-genre="Sci-Fi">Sci-Fi</button>
        <button class="chip" data-genre="Thriller">Thriller</button>
        <button class="chip" data-genre="Animation">Animation</button>
        <button class="chip" data-genre="Horror">Horror</button>
        <button class="chip" data-genre="Romance">Romance</button>
      </div>

      <div class="toolbar-right">
        <div class="select-field">
          <label for="statusFilter">Status</label>
          <select id="statusFilter">
            <option value="All">All</option>
            <option value="Watched">Watched</option>
            <option value="Unwatched">To Watch</option>
          </select>
        </div>

        <div class="select-field">
          <label for="sortSelect">Sort by</label>
          <select id="sortSelect">
            <option value="title-asc">Title (A–Z)</option>
            <option value="title-desc">Title (Z–A)</option>
            <option value="rating-desc">Rating (High–Low)</option>
            <option value="rating-asc">Rating (Low–High)</option>
            <option value="year-desc">Year (Newest)</option>
            <option value="year-asc">Year (Oldest)</option>
          </select>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ MAIN GRID ============ -->
  <main class="main-content">
    <div id="resultsMeta" class="results-meta"></div>
    <div id="movieGrid" class="movie-grid" aria-live="polite"></div>

    <div id="emptyState" class="empty-state" hidden>
      <svg viewBox="0 0 64 64" fill="none" aria-hidden="true"><rect x="8" y="14" width="48" height="36" rx="3" stroke="currentColor" stroke-width="2"/><path d="M8 24h48" stroke="currentColor" stroke-width="2"/><path d="M20 14v10M44 14v10" stroke="currentColor" stroke-width="2"/></svg>
      <h3>No titles found</h3>
      <p id="emptyStateText">Try a different search, filter, or add something new to your watchlist.</p>
    </div>
  </main>

  <!-- ============ FOOTER ============ -->
  <footer class="site-footer">
    <p>Reel List — a vanilla HTML, CSS &amp; JavaScript project. All data lives in your browser via LocalStorage.</p>
  </footer>

  <!-- ============ ADD / EDIT MODAL ============ -->
  <div id="movieModal" class="modal-overlay"  hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <h2 id="modalTitle">Add a Movie</h2>
        <button id="closeModalBtn" class="icon-btn" aria-label="Close">✕</button>
      </div>

      <form id="movieForm" class="modal-form">
        <div class="form-row">
          <label for="movieTitle">Title <span class="req">*</span></label>
          <input type="text" id="movieTitle" required maxlength="60" placeholder="e.g. Arrival">
        </div>

        <div class="form-row form-row-split">
          <div>
            <label for="movieGenre">Genre <span class="req">*</span></label>
            <select id="movieGenre" required>
              <option value="Action">Action</option>
              <option value="Drama">Drama</option>
              <option value="Comedy">Comedy</option>
              <option value="Sci-Fi">Sci-Fi</option>
              <option value="Thriller">Thriller</option>
              <option value="Animation">Animation</option>
              <option value="Horror">Horror</option>
              <option value="Romance">Romance</option>
            </select>
          </div>
          <div>
            <label for="movieYear">Release Year <span class="req">*</span></label>
            <input type="number" id="movieYear" required min="1900" max="2100" placeholder="2016">
          </div>
        </div>

        <div class="form-row form-row-split">
          <div>
            <label for="movieRating">Rating (0–10) <span class="req">*</span></label>
            <input type="number" id="movieRating" required min="0" max="10" step="0.1" placeholder="8.5">
          </div>
          <div>
            <label for="movieDuration">Duration (min)</label>
            <input type="number" id="movieDuration" min="1" max="600" placeholder="116">
          </div>
        </div>

        <div class="form-row">
          <label for="movieDescription">Short Description</label>
          <textarea id="movieDescription" rows="3" maxlength="220" placeholder="A one or two line synopsis…"></textarea>
        </div>

        <input type="hidden" id="movieId">

        <div class="form-actions">
          <button type="button" id="cancelBtn" class="btn btn-ghost">Cancel</button>
          <button type="submit" class="btn btn-primary" id="submitBtn">Add to Watchlist</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ============ TOAST ============ -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/movies.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  
</body>
</html>
